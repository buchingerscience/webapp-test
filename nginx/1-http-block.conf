    # --- test : HTTP (Let's Encrypt + redirection) ---
    server {
        listen 80;
        listen [::]:80;
        server_name test.buchinger-science.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }
