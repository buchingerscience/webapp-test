services:
  webapp-test:
    build: .
    container_name: webapp-test        # nginx reaches the app by this name
    expose:
      - "3000"                         # internal only — no host port (3000 is used by FASTEX)
    restart: unless-stopped
    networks:
      - shared-proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  shared-proxy:
    external: true                     # the network the shared nginx is attached to
