<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Inner Calm · Clinic staff</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css?v=__V__">
  <style>
    main { max-width: 1400px; }
    table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
    th { font-weight: 500; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; background: var(--card); }
    .scroll { overflow: auto; max-height: 75vh; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .tools input[type=search] { margin: 0; max-width: 340px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--card); }
    .seg button { border: 1px solid var(--line); background: var(--card); padding: 7px 12px; border-radius: 99px; cursor: pointer; font: inherit; font-size: 14px; color: var(--ink); }
    .seg button.on { background: var(--blue-tint); border-color: var(--mid-blue); }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eee9e1; }
    .tag.in_clinic { background: var(--accent-soft); color: var(--accent); }
    .tag.upcoming { background: var(--blue-tint); }
    .ok { color: var(--accent); }
    .pw button { width: auto; }
    .pw code { font-size: 17px; background: #fff7e0; padding: 3px 8px; border-radius: 6px; letter-spacing: .05em; }
    .note { background: var(--blue-tint); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin-bottom: 14px; }
    .note p { margin: 0 0 6px; max-width: none; } .note p:last-child { margin: 0; }
  </style>
</head>
<body>
  <header class="top" style="max-width:1400px; display:flex; align-items:center; justify-content:space-between; padding:20px 16px"><img src="/logo.svg" alt="Buchinger" style="height:34px"><span class="eyebrow">Inner Calm · Clinic staff</span></header>
  <main id="app"></main>
  <script type="module" src="/staff.js?v=__V__"></script>
</body>
</html>
