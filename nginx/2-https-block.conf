    # --- test : HTTPS ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name test.buchinger-science.com;

        ssl_certificate /etc/letsencrypt/live/test.buchinger-science.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.buchinger-science.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://webapp-test:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
